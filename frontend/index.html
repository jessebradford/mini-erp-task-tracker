<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mini ERP Task Tracker</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <h1>Mini ERP Task Tracker</h1>
    <p>Internal task management</p>
  </header>

  <<main>
  <section>
    <h2>Create Task</h2>

    <form id="task-form">
      <div>
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required />
      </div>

      <div>
        <label for="description">Description</label>
        <textarea id="description" name="description"></textarea>
      </div>

      <div>
        <label for="assigned_employee">Assigned Employee</label>
        <input
          id="assigned_employee"
          name="assigned_employee"
          type="text"
        />
      </div>

      <div>
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="Open">Open</option>
          <option value="In Progress">In Progress</option>
          <option value="Blocked">Blocked</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <div>
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <div>
        <label for="due_date">Due Date</label>
        <input id="due_date" name="due_date" type="date" />
      </div>

      <button type="submit">Create Task</button>
    </form>
  </section>

  <section>
    <h2>Tasks</h2>

    <div class="task-toolbar">
  <label for="status-filter">Filter by status</label>

  <select id="status-filter">
    <option value="All">All</option>
    <option value="Open">Open</option>
    <option value="In Progress">In Progress</option>
    <option value="Blocked">Blocked</option>
    <option value="Completed">Completed</option>
  </select>
</div>

    <p id="message">Loading tasks...</p>

    <div id="task-list">
      <!-- Tasks will be inserted here by JavaScript -->
    </div>
  </section>
</main>>
    <section>
      <h2>Tasks</h2>

      <p id="message">Loading tasks...</p>

      <div id="task-list">
        <!-- Tasks will be inserted here by JavaScript -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
